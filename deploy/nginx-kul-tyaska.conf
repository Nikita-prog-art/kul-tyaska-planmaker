# Культяшка за nginx: бесплатный домен вида <ip>.nip.io указывает на этот сервер,
# TLS-сертификат выдаёт Let's Encrypt (см. scripts/setup-https.sh).
#
# Файл ставится как /etc/nginx/sites-available/kul-tyaska и включается
# симлинком в sites-enabled. Сертификат и блок listen 443 добавляет certbot.

server {
    listen 80;
    listen [::]:80;
    server_name 162.254.85.195.nip.io;

    # Валидация Let's Encrypt (пока сертификата нет — отдаём заглушку).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 8m;
    }
}
